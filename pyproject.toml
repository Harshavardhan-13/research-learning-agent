[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-research-agent"
version = "1.0.0"
description = "A read-only Google ADK learning and research agent grounded with Google Search."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-adk==2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.15,<0.16",
]
eval = [
  "google-adk[eval]==2.9.0",
]
deploy = [
  "google-cloud-aiplatform[agent-engines]>=1.148.1,<2",
]

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
